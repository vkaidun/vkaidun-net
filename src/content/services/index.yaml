sectionTitle: "What I Can Help With"
items:
  - title: "Audit"
    description: "I'll help you figure out what's not working, what to focus on, and where to go next."
  - title: "UX & UI"
    description: "I improve player experience, clean up interfaces, and remove friction."
  - title: "Onboarding"
    description: "I make tutorials simple and effective, and smooth out your early-game funnel."
  - title: "Monetization"
    description: "I help build monetization that supports gameplay, not breaks it."
  - title: "Metagame"
    description: "I work with loops, progression, economy — systems that keep players coming back."
  - title: "Narrative"
    description: "I help structure the story, integrate it into gameplay, and avoid lore overload."
  - title: "Creative sessions"
    description: "I run workshops and brainstorms to help teams find new ideas or solve tough problems."
  - title: "Network"
    description: "I can connect you with trusted people in art, dev, QA, production, design — tested over the years."
